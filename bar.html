<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Barcode Toolkit v2.5</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.18.6/umd/index.min.js"></script>

    <style>
      :root {
        --bg: #f4f6fb;
        --bg-grad-1: #eef2ff;
        --bg-grad-2: #f5f3ff;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --border: #e2e8f0;
        --border-strong: #cbd5e1;
        --accent: #4f46e5;
        --accent-hover: #4338ca;
        --accent-soft: rgba(79, 70, 229, 0.08);
        --success: #16a34a;
        --success-soft: rgba(22, 163, 74, 0.1);
        --danger: #dc2626;
        --danger-soft: rgba(220, 38, 38, 0.1);
        --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
        --shadow-md: 0 4px 16px rgba(15, 23, 42, 0.06);
        --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.08);
        --radius: 14px;
        --radius-sm: 10px;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
        background:
          radial-gradient(
            circle at 0% 0%,
            var(--bg-grad-1) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 100% 100%,
            var(--bg-grad-2) 0%,
            transparent 50%
          ),
          var(--bg);
        background-attachment: fixed;
        color: var(--text);
        display: flex;
        justify-content: center;
        padding: 24px 16px;
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
      }

      /* ============ LOCK SCREEN ============ */
      #lock-screen {
        position: fixed;
        inset: 0;
        background: radial-gradient(
          circle at 30% 30%,
          #1e1b4b 0%,
          #0f172a 60%,
          #020617 100%
        );
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.5s ease;
      }
      #lock-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .lock-card {
        background: rgba(15, 23, 42, 0.55);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        padding: 2.5rem 2rem;
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
        text-align: center;
        max-width: 380px;
        width: 90%;
        animation: lockIn 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.2);
      }
      @keyframes lockIn {
        from {
          transform: translateY(20px) scale(0.95);
          opacity: 0;
        }
        to {
          transform: translateY(0) scale(1);
          opacity: 1;
        }
      }

      .lock-icon {
        font-size: 2.5rem;
        width: 72px;
        height: 72px;
        margin: 0 auto 1rem;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 12px 24px rgba(99, 102, 241, 0.4);
      }
      .lock-title {
        margin: 0 0 0.5rem;
        color: #f8fafc;
        font-size: 1.5rem;
        font-weight: 700;
      }
      .lock-subtitle {
        color: #94a3b8;
        margin: 0 0 2rem;
        font-size: 0.95rem;
      }

      .input-box {
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 14px;
        border-radius: 14px;
        margin-bottom: 1.5rem;
        transition:
          border-color 0.2s,
          background 0.2s;
      }
      .input-box:focus-within {
        border-color: #818cf8;
        background: rgba(0, 0, 0, 0.4);
      }
      .input-box.shake {
        animation: shake 0.4s;
        border-color: #ef4444 !important;
      }
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-10px);
        }
        75% {
          transform: translateX(10px);
        }
      }

      .input-box input {
        background: transparent;
        border: none;
        color: white;
        font-size: 1.75rem;
        text-align: center;
        width: 100%;
        outline: none;
        letter-spacing: 14px;
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
      }
      .input-box input::placeholder {
        color: #475569;
        letter-spacing: 14px;
      }

      #unlock-btn {
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: white;
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: 0.5px;
        cursor: pointer;
        transition:
          transform 0.15s,
          box-shadow 0.2s;
        box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
      }
      #unlock-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 24px rgba(99, 102, 241, 0.45);
      }
      #unlock-btn:active {
        transform: translateY(0);
      }

      .error-msg {
        color: #fca5a5;
        font-size: 0.85rem;
        margin-top: 0.85rem;
        min-height: 20px;
        opacity: 0;
        transition: opacity 0.3s;
      }
      .error-msg.visible {
        opacity: 1;
      }

      /* ============ MAIN APP ============ */
      .wrap {
        width: 100%;
        max-width: 1080px;
        opacity: 0;
        transform: translateY(8px);
        transition:
          opacity 0.5s 0.2s,
          transform 0.5s 0.2s;
      }
      .wrap.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .card {
        background: var(--card);
        border-radius: var(--radius);
        padding: 24px;
        box-shadow: var(--shadow-md);
        border: 1px solid var(--border);
        margin-bottom: 20px;
      }

      header.card {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 20px 24px;
      }
      .logo-mark {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent), #8b5cf6);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        box-shadow: 0 8px 16px rgba(79, 70, 229, 0.25);
        flex-shrink: 0;
      }
      header h1 {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      header p {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 440px;
        gap: 20px;
        align-items: start;
      }

      .section-title {
        margin: 0 0 18px 0;
        font-size: 0.85rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .section-title::before {
        content: "";
        width: 4px;
        height: 14px;
        background: var(--accent);
        border-radius: 2px;
      }

      .field {
        margin-bottom: 16px;
      }
      label {
        display: block;
        font-size: 0.875rem;
        color: var(--text);
        margin-bottom: 6px;
        font-weight: 500;
      }

      input,
      select {
        width: 100%;
        padding: 11px 14px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-strong);
        font-size: 15px;
        font-family: inherit;
        background: white;
        color: var(--text);
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      input::placeholder {
        color: #94a3b8;
      }
      input:hover,
      select:hover {
        border-color: #94a3b8;
      }
      input:focus,
      select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      select {
        appearance: none;
        -webkit-appearance: none;
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2364748b' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
        background-position: right 0.6rem center;
        background-repeat: no-repeat;
        background-size: 1.4em 1.4em;
        padding-right: 2.5rem;
        cursor: pointer;
      }

      button {
        padding: 11px 16px;
        border-radius: var(--radius-sm);
        border: 0;
        background: var(--accent);
        color: white;
        font-weight: 600;
        cursor: pointer;
        font-size: 15px;
        font-family: inherit;
        transition:
          background 0.15s,
          transform 0.1s,
          box-shadow 0.15s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      button:hover {
        background: var(--accent-hover);
      }
      button:active {
        transform: translateY(1px);
      }

      button.ghost {
        background: white;
        border: 1px solid var(--border-strong);
        color: var(--text);
      }
      button.ghost:hover {
        background: #f8fafc;
        border-color: var(--accent);
        color: var(--accent);
      }

      button.success {
        background: var(--success);
      }
      button.success:hover {
        background: #15803d;
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        transform: none !important;
      }

      .controls {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .controls button {
        flex: 1;
        min-width: 90px;
      }

      .store-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 10px;
        background: var(--accent-soft);
        color: var(--accent);
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 600;
        margin-left: 8px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      /* Barcode display */
      #barcodeWrapper {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: white;
        padding: 20px;
        border-radius: var(--radius-sm);
        min-height: 140px;
        border: 1px dashed var(--border-strong);
        transition: border-color 0.2s;
      }
      #barcodeWrapper.has-code {
        border-style: solid;
        border-color: var(--border);
      }
      #barcodeCanvas {
        max-width: 100%;
        height: auto;
        display: block;
      }

      #reducedBarcode {
        font-family: "JetBrains Mono", monospace;
        background: #f8fafc;
        border: 1px solid var(--border);
        padding: 12px;
        border-radius: var(--radius-sm);
        text-align: center;
        user-select: all;
        cursor: text;
        margin: 14px 0 0;
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--text);
        word-break: break-all;
      }
      #reducedBarcode.empty {
        color: var(--muted);
        font-weight: 400;
      }

      #status {
        text-align: center;
        margin-top: 14px;
        min-height: 1.4em;
        color: var(--muted);
        font-size: 0.9rem;
        padding: 8px 12px;
        border-radius: 8px;
        background: #f8fafc;
        transition:
          background 0.2s,
          color 0.2s;
      }
      #status.success {
        background: var(--success-soft);
        color: var(--success);
      }
      #status.error {
        background: var(--danger-soft);
        color: var(--danger);
      }

      .help {
        font-size: 0.8rem;
        color: var(--muted);
        margin: 6px 0 0;
      }

      /* Scanner controls row */
      .scanner-controls {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }
      .scanner-controls button {
        flex: 1;
      }

      /* Flip button icon spin animation */
      @keyframes flipSpin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(180deg);
        }
      }
      #flipBtn.spinning svg {
        animation: flipSpin 0.35s ease forwards;
      }

      video {
        width: 100%;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: #000;
        min-height: 200px;
        display: block;
      }

      #scannedResult {
        margin-top: 10px;
        padding: 8px 12px;
        border-radius: 8px;
        background: #f8fafc;
        color: var(--muted);
        font-size: 0.875rem;
        text-align: center;
      }
      #scannedResult.success {
        background: var(--success-soft);
        color: var(--success);
      }

      @media (max-width: 960px) {
        .grid {
          grid-template-columns: 1fr;
        }
        body {
          padding: 16px 12px;
        }
        .card {
          padding: 18px;
        }
      }
    </style>
  </head>
  <body>
    <!-- LOCK SCREEN -->
    <div id="lock-screen">
      <div class="lock-card">
        <div class="lock-icon">
          <svg
            width="32"
            height="32"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h2 class="lock-title">System Locked</h2>
        <p class="lock-subtitle">Enter access code to continue</p>
        <div class="input-box" id="inputBox">
          <input
            type="password"
            id="passwordInput"
            placeholder="••"
            maxlength="8"
            autocomplete="off"
            inputmode="numeric"
          />
        </div>
        <button id="unlock-btn">UNLOCK SYSTEM</button>
        <div class="error-msg" id="errorMsg">Incorrect code</div>
      </div>
    </div>

    <!-- MAIN APP -->
    <div class="wrap" id="mainApp">
      <header class="card">
        <div class="logo-mark">
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 5v14M7 5v14M11 5v14M15 5v14M19 5v14" />
          </svg>
        </div>
        <div>
          <h1>Barcode Toolkit</h1>
          <p>Generate · Scan · Reduce</p>
        </div>
      </header>

      <div class="grid">
        <!-- LEFT COLUMN -->
        <section class="card">
          <h2 class="section-title">Configuration</h2>

          <div class="field">
            <label for="storeSelect">Select Store</label>
            <select id="storeSelect">
              <option value="waitrose">Waitrose</option>
              <option value="sainsburys">Sainsbury's</option>
              <option value="ms">M&amp;S</option>
              <option value="morrisons">Morrisons</option>
              <option value="lidl">Lidl</option>
              <option value="asda">ASDA</option>
            </select>
          </div>

          <div class="field">
            <label for="originalBarcode">Original Barcode</label>
            <input
              id="originalBarcode"
              type="text"
              inputmode="numeric"
              placeholder="Enter barcode number…"
            />
          </div>

          <div id="dynamicOptions"></div>

          <div class="controls">
            <button id="generateBtn">Generate</button>
            <button id="copyBtn" class="ghost">Copy</button>
            <button id="clearBtn" class="ghost">Clear</button>
          </div>

          <div id="status">Ready</div>
        </section>

        <!-- RIGHT COLUMN -->
        <aside>
          <div class="card">
            <h3 class="section-title">Preview</h3>
            <div id="barcodeWrapper">
              <canvas id="barcodeCanvas"></canvas>
            </div>
            <div id="reducedBarcode" class="empty">—</div>
          </div>

          <div class="card">
            <h3 class="section-title">Scanner</h3>
            <select id="deviceSelect" style="margin-bottom: 10px">
              <option value="">Select Camera…</option>
            </select>
            <div class="scanner-controls">
              <button id="toggleScan" class="success">Start Camera</button>
              <button id="flipBtn" class="ghost" disabled title="Flip camera">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M1 4v6h6" />
                  <path d="M23 20v-6h-6" />
                  <path
                    d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"
                  />
                </svg>
                Flip
              </button>
              <button id="stopScan" class="ghost">Stop</button>
            </div>
            <video id="videoElement" autoplay muted playsinline></video>
            <div id="scannedResult">No scan yet</div>
          </div>
        </aside>
      </div>
    </div>

    <script>
      // ============================================
      // 1. LOCK SCREEN
      // ============================================
      const lockScreen = document.getElementById("lock-screen");
      const mainApp = document.getElementById("mainApp");
      const passwordInput = document.getElementById("passwordInput");
      const inputBox = document.getElementById("inputBox");
      const errorMsg = document.getElementById("errorMsg");
      const unlockBtn = document.getElementById("unlock-btn");

      const CORRECT_CODE = "19";

      function unlock() {
        const entered = passwordInput.value.trim();
        if (entered === CORRECT_CODE) {
          errorMsg.classList.remove("visible");
          lockScreen.classList.add("hidden");
          setTimeout(() => {
            mainApp.classList.add("visible");
            document.getElementById("originalBarcode").focus();
          }, 300);
        } else {
          inputBox.classList.add("shake");
          errorMsg.classList.add("visible");
          passwordInput.value = "";
          setTimeout(() => inputBox.classList.remove("shake"), 400);
        }
      }

      unlockBtn.onclick = unlock;
      passwordInput.onkeypress = (e) => {
        if (e.key === "Enter") unlock();
      };
      passwordInput.focus();

      // ============================================
      // 2. BARCODE GENERATION
      // ============================================
      const $ = (id) => document.getElementById(id);
      const onlyDigits = (str) => String(str || "").replace(/\D/g, "");

      // EAN-style mod10 (1/3 weighting from right)
      function calcCheckDigit(number) {
        let sum = 0;
        const digits = String(number).split("").reverse();
        for (let i = 0; i < digits.length; i++) {
          const d = parseInt(digits[i], 10) || 0;
          sum += i % 2 === 0 ? d * 3 : d;
        }
        const mod = sum % 10;
        return mod === 0 ? 0 : 10 - mod;
      }

      // Luhn checksum (for ASDA reduction barcodes)
      function calcLuhnChecksum(numberString) {
        let sum = 0;
        let shouldDouble = true;
        for (let i = numberString.length - 1; i >= 0; i--) {
          let digit = parseInt(numberString.charAt(i), 10);
          if (shouldDouble) {
            digit *= 2;
            if (digit > 9) digit -= 9;
          }
          sum += digit;
          shouldDouble = !shouldDouble;
        }
        return (10 - (sum % 10)) % 10;
      }

      function buildBarcode(store, orig) {
        orig = onlyDigits(orig);

        if (!orig && store !== "ms") {
          throw new Error("Please enter a barcode");
        }

        switch (store) {
          case "waitrose":
            return "10" + orig.padStart(13, "0") + "00100";

          case "sainsburys": {
            const custom = onlyDigits($("customCode")?.value || "");
            const padding = custom.length > 3 ? "00" : "000";
            const withoutCheck = "91" + orig + padding + custom;
            return withoutCheck + calcCheckDigit(withoutCheck);
          }

          case "ms": {
            const price = onlyDigits($("price")?.value || "");
            if (price.length !== 5) throw new Error("Price must be 5 digits");
            const item = orig || "000000";
            return "822" + item.padStart(6, "0") + "00002" + price;
          }

          case "morrisons": {
            const mBase = "92" + orig.padStart(10, "0") + "0011330002";
            return mBase.slice(0, 12) + calcCheckDigit(mBase.slice(0, 12));
          }

          case "lidl": {
            const disc = $("discountSelect")?.value || "50";
            return (disc === "50" ? "56" : "55") + orig.padStart(11, "0");
          }

          case "asda": {
            const pence = parseInt($("penceAmount")?.value, 10);
            if (isNaN(pence) || pence < 1 || pence > 9999) {
              throw new Error("Enter pence amount (1–9999)");
            }
            const formattedPence = pence.toString().padStart(5, "0");
            const base = "510" + orig + formattedPence + "1960";
            return base + calcLuhnChecksum(base);
          }

          default:
            return orig;
        }
      }

      function formatDisplay(store, code) {
        if (store === "asda") {
          const orig = $("originalBarcode").value.replace(/\D/g, "");
          const pence = String(parseInt($("penceAmount").value, 10)).padStart(
            5,
            "0",
          );
          const check = code.slice(-1);
          return `510 ${orig} ${pence} 1960${check}`;
        }
        return code;
      }

      let currentCode = "";

      function setStatus(msg, type) {
        const el = $("status");
        el.textContent = msg;
        el.classList.remove("success", "error");
        if (type) el.classList.add(type);
      }

      function generate() {
        try {
          const store = $("storeSelect").value;
          const code = buildBarcode(store, $("originalBarcode").value);
          currentCode = code;

          const canvas = $("barcodeCanvas");
          JsBarcode(canvas, code, {
            format: "CODE128",
            width: 2,
            height: 80,
            displayValue: true,
            fontSize: 16,
            fontOptions: "bold",
            font: "JetBrains Mono, monospace",
            margin: 10,
            background: "#ffffff",
            lineColor: "#0f172a",
          });

          $("barcodeWrapper").classList.add("has-code");
          const display = formatDisplay(store, code);
          $("reducedBarcode").textContent = display;
          $("reducedBarcode").classList.remove("empty");
          setStatus("✓ Generated successfully", "success");
        } catch (e) {
          setStatus("⚠ " + e.message, "error");
          currentCode = "";
          $("reducedBarcode").textContent = "—";
          $("reducedBarcode").classList.add("empty");
          $("barcodeWrapper").classList.remove("has-code");

          const canvas = $("barcodeCanvas");
          const ctx = canvas.getContext("2d");
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          canvas.removeAttribute("width");
          canvas.removeAttribute("height");
        }
      }

      function renderOptions() {
        const store = $("storeSelect").value;
        let html = "";

        if (store === "lidl") {
          html = `<div class="field">
          <label>Discount</label>
          <select id="discountSelect">
            <option value="50">50% off (prefix 56)</option>
            <option value="20">20% off (prefix 55)</option>
          </select>
        </div>`;
        } else if (store === "ms") {
          html = `<div class="field">
          <label>Price (5 digits)</label>
          <input id="price" type="text" maxlength="5" inputmode="numeric" placeholder="00100">
          <p class="help">Format: 00100 = £1.00, 01250 = £12.50</p>
        </div>`;
        } else if (store === "sainsburys") {
          html = `<div class="field">
          <label>Custom Code (optional)</label>
          <input id="customCode" type="text" maxlength="4" inputmode="numeric" placeholder="0000">
          <p class="help">Leave blank or use 0000 for default</p>
        </div>`;
        } else if (store === "asda") {
          html = `<div class="field">
          <label>Pence Amount (p)</label>
          <input id="penceAmount" type="number" min="1" max="9999" inputmode="numeric" placeholder="e.g. 50 for 50p">
          <p class="help">Luhn checksum auto-calculated · format 510 · pence · 1960 · check</p>
        </div>`;
        }

        $("dynamicOptions").innerHTML = html;
        generate();
      }

      $("storeSelect").onchange = renderOptions;
      $("originalBarcode").oninput = generate;
      $("generateBtn").onclick = generate;
      $("dynamicOptions").addEventListener("input", generate);

      $("copyBtn").onclick = async () => {
        if (!currentCode) {
          setStatus("Nothing to copy", "error");
          return;
        }
        try {
          await navigator.clipboard.writeText(currentCode);
          setStatus("✓ Copied: " + currentCode, "success");
        } catch {
          setStatus("⚠ Copy failed", "error");
        }
      };

      $("clearBtn").onclick = () => {
        $("originalBarcode").value = "";
        if ($("price")) $("price").value = "";
        if ($("customCode")) $("customCode").value = "";
        if ($("penceAmount")) $("penceAmount").value = "";
        currentCode = "";

        const canvas = $("barcodeCanvas");
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        canvas.removeAttribute("width");
        canvas.removeAttribute("height");

        $("reducedBarcode").textContent = "—";
        $("reducedBarcode").classList.add("empty");
        $("barcodeWrapper").classList.remove("has-code");
        setStatus("Cleared");
        $("originalBarcode").focus();
      };

      // ============================================
      // 3. SCANNER
      // ============================================
      const codeReader = new ZXing.BrowserMultiFormatReader();
      let scanning = false;
      let allDevices = []; // full list of video input devices
      let currentDeviceIndex = 0; // index into allDevices currently in use

      async function startScanWithDevice(deviceId) {
        // Reset reader so we can cleanly start a new stream
        codeReader.reset();

        await codeReader.decodeFromVideoDevice(
          deviceId,
          "videoElement",
          (res) => {
            if (res) {
              $("scannedResult").textContent = "✓ Scanned: " + res.text;
              $("scannedResult").classList.add("success");
              $("originalBarcode").value = res.text;
              generate();
              stopScan();
            }
          },
        );
      }

      async function startScan() {
        try {
          allDevices = await codeReader.getVideoInputDevices();
          const sel = $("deviceSelect");
          sel.innerHTML = "";

          if (!allDevices.length) throw new Error("No camera found");

          allDevices.forEach((d, i) => {
            const opt = document.createElement("option");
            opt.value = d.deviceId;
            opt.textContent = d.label || "Camera " + (i + 1);
            sel.appendChild(opt);
          });

          // Default: prefer back camera on mobile (look for "back" / "environment" in label)
          const backIndex = allDevices.findIndex((d) =>
            /back|rear|environment/i.test(d.label),
          );
          currentDeviceIndex = backIndex >= 0 ? backIndex : 0;
          sel.selectedIndex = currentDeviceIndex;

          await startScanWithDevice(allDevices[currentDeviceIndex].deviceId);

          scanning = true;
          $("toggleScan").textContent = "Scanning…";

          // Enable flip only when there are multiple cameras
          const flipBtn = $("flipBtn");
          flipBtn.disabled = allDevices.length < 2;
        } catch (e) {
          setStatus("⚠ Camera error: " + e.message, "error");
        }
      }

      async function flipCamera() {
        if (!scanning || allDevices.length < 2) return;

        const flipBtn = $("flipBtn");

        // Spin animation
        flipBtn.classList.add("spinning");
        setTimeout(() => flipBtn.classList.remove("spinning"), 350);

        // Advance to next camera
        currentDeviceIndex = (currentDeviceIndex + 1) % allDevices.length;
        const nextDevice = allDevices[currentDeviceIndex];

        // Update the dropdown to match
        $("deviceSelect").selectedIndex = currentDeviceIndex;

        try {
          await startScanWithDevice(nextDevice.deviceId);
        } catch (e) {
          setStatus("⚠ Could not switch camera: " + e.message, "error");
        }
      }

      function stopScan() {
        codeReader.reset();
        scanning = false;
        $("toggleScan").textContent = "Start Camera";
        $("flipBtn").disabled = true;
      }

      $("toggleScan").onclick = startScan;
      $("stopScan").onclick = stopScan;
      $("flipBtn").onclick = flipCamera;

      // Sync manual dropdown change with currentDeviceIndex
      $("deviceSelect").onchange = async function () {
        if (!scanning) return;
        currentDeviceIndex = this.selectedIndex;
        try {
          await startScanWithDevice(allDevices[currentDeviceIndex].deviceId);
        } catch (e) {
          setStatus("⚠ Could not switch camera: " + e.message, "error");
        }
      };

      // Init
      renderOptions();
    </script>
  </body>
</html>
